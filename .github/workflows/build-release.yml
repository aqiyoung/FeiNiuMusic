name: build-release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 签名密钥（可选）：
      # 若仓库配置了 ANDROID_KEYSTORE_BASE64 等 secret，则解码出 release.p12 (PKCS12)
      # 并把 SIGNING_* 注入后续步骤环境，产出「正式签名」包（可上架 / 覆盖升级）。
      # 若未配置，则脚本自动跳过 —— build.gradle 会回退到 debug 签名，
      # 产出可直接安装测试的 APK（不能上架，也不能覆盖正式签名安装）。
      # 注意：secrets 不能写在 step 的 if: 表达式里（GitHub 限制），故在脚本内判断。
      - name: Set up signing keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            {
              echo "SIGNING_STORE_FILE=release.p12"
              echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "::notice::release signing enabled (正式签名)"
          else
            echo "::notice::未配置 keystore secret —— 将产出 debug 签名 APK（可直接安装测试）"
          fi

      - run: flutter pub get

      - name: Compute version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=${FULL_VERSION%%+*}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 1) 正式包：默认包名 com.feiniu.music，三个 CPU 架构全部保留
      - run: flutter build apk --release --split-per-abi

      - run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             FeiNiuMusic-v${VERSION}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             FeiNiuMusic-v${VERSION}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
             FeiNiuMusic-v${VERSION}-x86_64.apk

      # 2) 汽水音乐兼容包（非官方）：applicationId 覆盖为 com.luna.music，仅 arm64。
      #    用于鸿蒙 4/6、iQOO、VIVO 的播控中心显示汽水音乐控制（见 README 声明）。
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg applicationIdOverride=com.luna.music

      - run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             FeiNiuMusic-v${VERSION}-z-luna-arm64-v8a.apk

      - run: |
          git log -1 --pretty=format:"- %s%n%b" > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "- ${GITHUB_SHA}" > release_notes.txt
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release_notes.txt
          files: |
            FeiNiuMusic-v${{ env.VERSION }}-arm64-v8a.apk
            FeiNiuMusic-v${{ env.VERSION }}-armeabi-v7a.apk
            FeiNiuMusic-v${{ env.VERSION }}-x86_64.apk
            FeiNiuMusic-v${{ env.VERSION }}-z-luna-arm64-v8a.apk
